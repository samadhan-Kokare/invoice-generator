<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="600" viewBox="0 0 1600 600" role="img" aria-labelledby="title desc">
  <title id="title">Digital Tax Partner</title>
  <desc id="desc">Navy and teal DP monogram with a document checkmark and upward growth bars, beside the Digital Tax Partner wordmark.</desc>
  <defs>
    <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B2545"/><stop offset="1" stop-color="#124E78"/></linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#08A878"/><stop offset="1" stop-color="#087E83"/></linearGradient>
  </defs>
  <rect width="1600" height="600" fill="#FFFFFF"/>
  <!-- DP-inspired emblem -->
  <g transform="translate(55 70)">
    <!-- document -->
    <path d="M270 32h105l48 48v112h-43V98h-47V75h-63z" fill="#FFFFFF" stroke="url(#navy)" stroke-width="10" stroke-linejoin="round"/>
    <path d="M375 33v47h47" fill="none" stroke="url(#teal)" stroke-width="10" stroke-linejoin="round"/>
    <path d="M294 112h70M294 137h57" stroke="#0B2545" stroke-width="10" stroke-linecap="round"/>
    <circle cx="395" cy="155" r="31" fill="url(#teal)"/>
    <path d="m381 155 10 11 20-24" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- bold D form -->
    <path d="M30 150h125c100 0 164 62 164 157S255 464 155 464H30V387h120c55 0 87-30 87-80s-32-80-87-80H30z" fill="url(#navy)"/>
    <!-- P form -->
    <path d="M278 214h91c78 0 124 42 124 109s-46 109-124 109h-34v-72h34c31 0 49-13 49-37s-18-37-49-37h-91z" fill="url(#teal)"/>
    <!-- growth bars -->
    <rect x="82" y="350" width="25" height="58" rx="5" fill="#08A878"/>
    <rect x="121" y="320" width="25" height="88" rx="5" fill="#08A878" opacity=".88"/>
    <rect x="160" y="282" width="25" height="126" rx="5" fill="#08A878" opacity=".76"/>
    <!-- rising swoosh -->
    <path d="M22 437c121-8 249-65 359-161" fill="none" stroke="#FFFFFF" stroke-width="28" stroke-linecap="round"/>
    <path d="M22 437c121-8 249-65 359-161" fill="none" stroke="url(#teal)" stroke-width="17" stroke-linecap="round"/>
    <path d="m358 267 42-9-9 42z" fill="#08A878"/>
  </g>
  <path d="M610 120V480" stroke="#B7C1C9" stroke-width="3"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="670" y="255" font-size="104" font-weight="800" letter-spacing="2" fill="#0B2545">DIGITAL</text>
    <text x="670" y="365" font-size="91" font-weight="800" letter-spacing="1">
      <tspan fill="#08A878">TAX</tspan><tspan fill="#0B2545"> PARTNER</tspan>
    </text>
    <text x="674" y="425" font-size="24" font-weight="600" letter-spacing="4" fill="#3F4D5B">COMPLIANCE</text>
    <circle cx="867" cy="417" r="5" fill="#08A878"/>
    <text x="892" y="425" font-size="24" font-weight="600" letter-spacing="3" fill="#3F4D5B">CONSULTING</text>
    <circle cx="1105" cy="417" r="5" fill="#08A878"/>
    <text x="1130" y="425" font-size="24" font-weight="600" letter-spacing="3" fill="#3F4D5B">YOUR GROWTH</text>
    <path d="M674 472h75M1440 472h75" stroke="#3F4D5B" stroke-width="2"/>
    <text x="1095" y="481" text-anchor="middle" font-size="21" letter-spacing="7" fill="#3F4D5B">SIMPLER TAX. BRIGHTER BUSINESS.</text>
  </g>
</svg>
